[package]
name = "lerch-prime-search"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

